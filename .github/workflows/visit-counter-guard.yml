name: visit-counter-guard

# 守护全站访问量统计：任何改动若删除/调小历史基数、漏接页面统计脚本
# 或让版本号不一致，本工作流会失败并给出具体错误。
# 校验逻辑见 scripts/verify_visit_counter.py。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify visit counter integrity
        run: python3 scripts/verify_visit_counter.py
