        <div class="poem-body">
        <div class="poem-headline">绝句 · 丙申端午</div>
        <div class="poem-verse">龙潜深渊无人知，</div>
        <div class="poem-verse">鲲扶青天鸠笑痴。</div>
        <div class="poem-verse">一朝冲破旧藩篱，</div>
        <div class="poem-verse">便是拨云见日时。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵丙申年端午于祥云苑</div>
        <div class="poem-blank"></div>
        <div class="poem-note">注：1. 见《周易》中的“潜龙勿用”；</div>
        <div class="poem-note">2. 见《庄子》“逍遥游”篇中的典故。</div>
        </div>
      </div>
