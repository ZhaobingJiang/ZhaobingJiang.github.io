        <div class="poem-headline">西塘古镇</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">青瓦白墙彩西塘，</div>
        <div class="poem-verse">碧水银桥绿丝长。</div>
        <div class="poem-verse">红灯乌篷金银杏，</div>
        <div class="poem-verse">诗画人间美名扬。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2017年12月2日于西塘古镇</div>
