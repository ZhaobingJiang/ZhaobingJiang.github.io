        <div class="poem-body">
        <div class="poem-headline">赤脚弄潮</div>
        <div class="poem-verse">波涛翻滚浑身胆，</div>
        <div class="poem-verse">谈笑风生自岿然。</div>
        <div class="poem-verse">临碣愿似曹公在，</div>
        <div class="poem-verse">赤脚弄潮亦欢颜。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2006年9月</div>
