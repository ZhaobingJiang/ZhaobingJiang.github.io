        <div class="poem-body">
        <div class="poem-headline">拟咏怀（一）</div>
        <div class="poem-verse">少时意气重，恩仇志未休。</div>
        <div class="poem-verse">倚天欲斩妖，屠龙思荡寇。</div>
        <div class="poem-verse">学通理史哲，文思辞赋流。</div>
        <div class="poem-verse">历览古今路，善恶难辨忧。</div>
        <div class="poem-verse">回归守本真，风雨亦无愁。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2024年7月28日于澜悦栖原居</div>
        </div>
