        <div class="poem-headline">逍遥游</div>
        <div class="poem-verse">鹏先高飞为图南，</div>
        <div class="poem-verse">九万里处再向前。</div>
        <div class="poem-verse">默伏三载登高处，</div>
        <div class="poem-verse">笑傲江湖心境宽。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2002年10月</div>
