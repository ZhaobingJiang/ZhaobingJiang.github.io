      <div class="poem">
        <pre class="poem-body">锡婚记
风雨十年，始于情缘。
无惧清寒，不悔手牵。
回望途坎，辛劳与汗。
长空侣雁，相随相伴。
勇跨险滩，直挂云帆。
星星点点，终见源泉。
远望山巅，风光无限。
幸甚至哉，幸福如愿。

——江召兵（2018.07.18）</pre>
