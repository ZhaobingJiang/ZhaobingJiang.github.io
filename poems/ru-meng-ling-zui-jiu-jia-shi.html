        <div class="poem-verse">昨夜好友欢聚</div>
        <div class="poem-verse">划拳摇骰呕吐</div>
        <div class="poem-verse">空剩酒囊肚</div>
        <div class="poem-verse">朦胧驾车离去</div>
        <div class="poem-verse">超速  超速</div>
        <div class="poem-verse">魂断不归路</div>
