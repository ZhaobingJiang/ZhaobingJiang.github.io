        <div class="poem-body">
        <div class="poem-headline">拟咏怀（三）</div>
        <div class="poem-verse">乱世崇姜尚，避祸学张良。</div>
        <div class="poem-verse">人生如星逝，际遇难再望。</div>
        <div class="poem-verse">鲲鹏乘风起，龙马踏云翔。</div>
        <div class="poem-verse">蚕蛹默无声，蛰伏待时光。</div>
        <div class="poem-verse">扬帆逐晓日，梦想华山冈。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2024年7月29日于银城INC中心</div>
        </div>
