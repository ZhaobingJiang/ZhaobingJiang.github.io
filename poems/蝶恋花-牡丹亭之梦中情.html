        <div class="poem-headline">蝶恋花 · 牡丹亭之梦中情</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">后园花胜春已过。</div>
        <div class="poem-verse">雨霁云空，</div>
        <div class="poem-verse">万点胭脂堕。</div>
        <div class="poem-verse">燕子归来寻旧罗。</div>
        <div class="poem-verse">东风吹散香尘锁。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">满地残红人懒卧。</div>
        <div class="poem-verse">绿掩池塘，</div>
        <div class="poem-verse">几度斜阳破。</div>
        <div class="poem-verse">惆怅韶华浑似我。</div>
        <div class="poem-verse">相逢只待江南柯。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵 2023年5月2日于澜悦栖原居</div>
      </div>
