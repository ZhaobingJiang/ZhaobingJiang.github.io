        <div class="poem-body">
        <div class="poem-headline">洞玄观怀古</div>
        <div class="poem-verse">寻迹点将台，</div>
        <div class="poem-verse">误入洞玄观。</div>
        <div class="poem-verse">昔日孙仲谋，</div>
        <div class="poem-verse">今朝难寻见。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵 2024年6月9日于方山地质公园</div>
