        <pre class="poem-body">天净沙·夏冥

嫩草绿柳黄鸭，
小桥流水人家，
新陌凉风宝马。
摇曳红花，
笑语传天涯。

 ——江召兵2019年7月18日于江宁美丽乡村钱家渡</pre>
