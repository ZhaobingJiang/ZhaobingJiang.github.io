        <div class="poem-body">
        <div class="poem-headline">贺大宝生日</div>
        <div class="poem-verse">十三岁月问南北，</div>
        <div class="poem-verse">追风少年慕星辰。</div>
        <div class="poem-verse">诚朴纯真是学生，</div>
        <div class="poem-verse">风雨兼程望红日。</div>
        <div class="poem-verse">恣意扬鞭白驹快，</div>
        <div class="poem-verse">勇攀高峰享世乐。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2022年2月11日（农历正月十一）于澜悦栖原居</div>
        </div>
