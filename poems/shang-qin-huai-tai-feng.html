      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">上秦淮台风日有感</div>
        <div class="poem-verse">黑云吞尽秣陵阁，雾锁方山失旧畴。</div>
        <div class="poem-verse">折臂梧桐横野径，褪裙紫薇泣浅沟。</div>
        <div class="poem-verse">藏身黄鹂噤金嗓，避浪银鸥蜷苇洲。</div>
        <div class="poem-verse">唯有池杉千尺立，擎天蘸雨写春秋！</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2025年7月31日晨于上秦淮湿地公园</div>
        </div>
      </div>
