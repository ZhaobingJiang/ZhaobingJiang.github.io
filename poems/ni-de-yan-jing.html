    </div>
    <section class="section">
      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">你的眼睛</div>
        <div class="poem-verse">抬头张望</div>
        <div class="poem-verse">寻找你在的地方</div>
        <div class="poem-verse">你脉脉的眼神</div>
        <div class="poem-verse">放射出火辣辣的光芒</div>
        <div class="poem-verse">而我</div>
        <div class="poem-verse">像一只蜗牛</div>
        <div class="poem-verse">避开你的眼光</div>
        <div class="poem-verse">一只受惊的小鹿</div>
        <div class="poem-verse">逃进了我的心房</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2003年5月</div>
        </div>
      </div>
      <p class="poem-pager"><a class="pub-dl" href="./wo-shi-wo.html">&larr; 我是我</a>&nbsp;&nbsp;|&nbsp;&nbsp;<a class="pub-dl" href="./xiang-nian-de-tian-kong.html">想念的天空 &rarr;</a></p>
