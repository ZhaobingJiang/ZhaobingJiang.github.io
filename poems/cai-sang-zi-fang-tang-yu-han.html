        <div class="poem-headline">采桑子 · 方塘遇旱</div>
        <div class="poem-verse">方塘遇旱终觉浅，块磊叠乱，虾闹蟹欢，水浑波暗鱼亦癫。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">子房妙计桃花源，风清云淡，阔海高天，悠然逐浪蓬莱仙。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2022年5月2日于九龙湖公园</div>
        </div>
