        <div class="poem-body">
        <div class="poem-headline">桂花迟至</div>
        <div class="poem-verse">蟹横中秋无花赏，</div>
        <div class="poem-verse">丹桂袭人今又香。</div>
        <div class="poem-verse">无问世事迷人眼，</div>
        <div class="poem-verse">天地调和论阴阳。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2021年10月22日于澜悦栖原居</div>
        </div>
