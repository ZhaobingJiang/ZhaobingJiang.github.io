        <div class="poem-body">
        <div class="poem-headline">律诗两首</div>
        <div class="essay-subhead">（一）</div>
        <div class="poem-verse">今宵月正圆，</div>
        <div class="poem-verse">悠悠思念淡。</div>
        <div class="poem-verse">遥望故乡远，</div>
        <div class="poem-verse">亲人难相见。</div>
        <div class="essay-subhead">（二）</div>
        <div class="poem-verse">飘飘白云一女神，</div>
        <div class="poem-verse">潺潺流水濯心灵。</div>
        <div class="poem-verse">展翅鹏飞遥望远，</div>
        <div class="poem-verse">胸中更有铁长城。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵1999年9月</div>
        </div>
      </div>
