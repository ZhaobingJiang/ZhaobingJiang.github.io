      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">栖园揽胜</div>
        <div class="poem-verse">曦晨人马静，素日浮方山。</div>
        <div class="poem-verse">柴扉掩朝霞，清风拂石楠。</div>
        <div class="poem-verse">喜鹊鸣空谷，金蜂戏杜鹃。</div>
        <div class="poem-verse">不喜闹市喧，偏爱幽郊远。</div>
        <div class="poem-verse">得失分两半，何须羡神仙？！</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2021年4月17日于澜悦栖原居</div>
        </div>
      </div>
