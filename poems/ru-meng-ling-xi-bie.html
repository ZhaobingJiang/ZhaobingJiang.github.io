        <div class="poem-verse">（为曾经同桌的女孩而作）</div>
        <div class="poem-verse">随缘浮萍相聚</div>
        <div class="poem-verse">欢声笑语常驻</div>
        <div class="poem-verse">分离在眼前</div>
        <div class="poem-verse">空留心中泪珠</div>
        <div class="poem-verse">悲叹  悲叹</div>
        <div class="poem-verse">全都顺风而去</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2000年4月</div>
