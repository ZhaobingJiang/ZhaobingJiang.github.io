        <div class="poem-headline">打油诗一首——纪念黄码变绿码</div>
        <div class="poem-sign">——纪念黄码变绿码</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">漫漫黄码日度年，</div>
        <div class="poem-verse">居家办公如闭关。</div>
        <div class="poem-verse">我谓何时清妖孽？</div>
        <div class="poem-verse">清肺洗脑换人间。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2021年8月4日于澜悦栖原居</div>
