        <div class="poem-headline">踏莎行 · 金陵瑞雪</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">玉镜台前，碧罗窗下。梨花院落清明夜。寒风吹梦到江南，画帘不卷雁去也。</div>
        <div class="poem-verse">柳絮漫天，梅梢满把。年芳暗逐流光谢。谁家庭柏报新阳，枝头点缀琼瑶瓦。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵，2023年12月19日于澜悦栖原居</div>
      </div>
