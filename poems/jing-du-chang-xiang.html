    <section class="section">
      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">京都畅想</div>
        <div class="poem-verse">尽赏疏影横斜意，</div>
        <div class="poem-verse">遍踏万水千山情。</div>
        <div class="poem-verse">鹤划长空留声唳，</div>
        <div class="poem-verse">虎啸深山归林隐。</div>
        <div class="poem-verse">过隙人生逝近半，</div>
        <div class="poem-verse">欲嵌星空添清影。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2023年2月28日于北京HF学院附近</div>
        </div>
      </div>
