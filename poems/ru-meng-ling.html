      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">如梦令</div>
        <div class="poem-verse">昨日野坡觅蒜，</div>
        <div class="poem-verse">今晨披星远行。</div>
        <div class="poem-verse">归来夜已深，</div>
        <div class="poem-verse">灯明影浓虫吟。</div>
        <div class="poem-verse">细听，细听，</div>
        <div class="poem-verse">仰见云淡风清。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2023年3月12日于澜悦栖原居</div>
        </div>
      </div>
