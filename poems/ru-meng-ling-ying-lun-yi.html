        <div class="poem-headline">如梦令 · 英伦访学（一）</div>
        <div class="poem-verse">夜长隔窗听雨，</div>
        <div class="poem-verse">荷蕉轻吟乐曲。</div>
        <div class="poem-verse">冽风乍起时，</div>
        <div class="poem-verse">梦绕山青水绿。</div>
        <div class="poem-verse">急赴，急赴，</div>
        <div class="poem-verse">怎比热血故土。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵，乙未年孟冬</div>
        </div>
