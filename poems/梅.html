      <div class="poem">
        <pre class="poem-body">梅

枯枝枯叶枯荷塘，
更添冷雨波荡漾。
深冬不随百树凋，
独傲寒霜吐暗香。

——江召兵2020年1月7日于竹山路校区</pre>
