        <div class="poem-headline">夜读</div>
        <div class="poem-sign">——我家大宝的诗</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">翩翩落叶迎秋露，</div>
        <div class="poem-verse">清风黄蝶漫天舞。</div>
        <div class="poem-verse">未料一夜金满地，</div>
        <div class="poem-verse">坐斋晚读只顾书。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江北辰2021年11月21日于书房</div>
        </div>
      </div>
