        <div class="poem-headline">七律 · 水墨西湖</div>
        <div class="poem-verse">断桥无雪涵虚白，苏堤春烟湿未晴。</div>
        <div class="poem-verse">西泠墨气凝千载，湖心琴韵绕孤亭。</div>
        <div class="poem-verse">半篙云影分山黛，一楫鳞波动画屏。</div>
        <div class="poem-verse">最是天然西子态，不施脂粉自倾城。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵+AI 2025年2月27日于西湖</div>
        </div>
