        <div class="poem-headline">挖笋记</div>
        <div class="poem-verse">得闲荷锄无想山，齐挖春笋意欣然。</div>
        <div class="poem-verse">波光潋滟天鹅舞，海棠花开香满园。</div>
        <div class="poem-verse">新竹破土龙腾天，泥香四溢黄鹂欢。</div>
        <div class="poem-verse">今朝篮盈心满足，明年春日定重还。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2024年4月7日于溧水无想山</div>
        </div>
