        <div class="poem-headline">天净沙·夏冥</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">嫩草绿柳黄鸭，</div>
        <div class="poem-verse">小桥流水人家，</div>
        <div class="poem-verse">新陌凉风宝马。</div>
        <div class="poem-verse">摇曳红花，</div>
        <div class="poem-verse">笑语传天涯。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2019年7月18日于江宁美丽乡村钱家渡</div>
