      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">七律 · 贺新婚</div>
        <div class="poem-sign">——赠给兄弟黄攀</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">湘西湘南有情缘，</div>
        <div class="poem-verse">帅哥美女湖大恋。</div>
        <div class="poem-verse">永结同心百年好，</div>
        <div class="poem-verse">神仙鸳鸯亦艳羡。</div>
        <div class="poem-verse">鹊桥四季如春暖，</div>
        <div class="poem-verse">金屋里外爱缠绵。</div>
        <div class="poem-verse">父母福寿儿孙乐，</div>
        <div class="poem-verse">世人都夸栗与攀。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2007年1月2日</div>
        </div>
      </div>
