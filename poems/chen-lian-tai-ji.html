      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">晨练太极</div>
        <div class="poem-verse">一曲云水浣尘襟，几翩鹭影入空林。</div>
        <div class="poem-verse">太极圆转开万象，周身气脉接通明。</div>
        <div class="poem-verse">湖光澄澈初阳染，秋桂扶风金霭沁。</div>
        <div class="poem-verse">白云舒卷原无迹，始觉拳中天地心。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2025年10月28日于百家湖公园</div>
        </div>
      </div>
