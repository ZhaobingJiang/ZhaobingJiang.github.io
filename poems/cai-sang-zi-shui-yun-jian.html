        <div class="poem-headline">采桑子 · 水云涧</div>
        <div class="poem-verse">江宁胜景水云涧，绿萍滚珠，浓柳拂面，青蓝红紫不足看。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">球戏微波曲槛边，浮云慵懒，稚子撒欢，野草丛中挖野蒜。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2022年5月1日于江宁水云涧</div>
        </div>
      </div>
