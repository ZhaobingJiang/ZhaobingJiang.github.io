    <section class="section">
      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">月夜</div>
        <div class="poem-verse">深夜梦醒</div>
        <div class="poem-verse">浮动你水仙般的身影</div>
        <div class="poem-verse">还有你珍珠般的眼睛</div>
        <div class="poem-verse">和着柔和的想念的琴声</div>
        <div class="poem-verse">思绪向你靠近</div>
        <div class="poem-verse">可是虫声依旧</div>
        <div class="poem-verse">梦也无情</div>
        <div class="poem-verse">周围淡淡的月色</div>
        <div class="poem-verse">水一般的寂静</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2001年12月</div>
        </div>
      </div>
