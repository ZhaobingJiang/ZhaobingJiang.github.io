      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">立春晨曲</div>
        <div class="poem-verse">早春新露滴，清响映空寂。</div>
        <div class="poem-verse">腊梅含浓香，幽馨散林邑。</div>
        <div class="poem-verse">晨曦人未起，幽径独行稀。</div>
        <div class="poem-verse">鸟鸣绿叶间，声声迎晓霁。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2024年2月4日于澜悦栖原居</div>
        </div>
      </div>
