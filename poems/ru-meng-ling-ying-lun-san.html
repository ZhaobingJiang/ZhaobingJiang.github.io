        <div class="poem-headline">如梦令 · 英伦访学（三）</div>
        <div class="poem-verse">昨夜犹在囚笼，</div>
        <div class="poem-verse">今朝细雨独宠。</div>
        <div class="poem-verse">偶遇月影动，</div>
        <div class="poem-verse">却似宫阙仙琼。</div>
        <div class="poem-verse">朦胧，朦胧，</div>
        <div class="poem-verse">怎奈流逝太匆匆。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵，乙未年仲冬</div>
        </div>
