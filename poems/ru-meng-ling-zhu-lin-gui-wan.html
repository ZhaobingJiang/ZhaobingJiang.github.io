        <div class="poem-body">
        <div class="poem-headline">如梦令 · 竹林归晚</div>
        <div class="poem-verse">独自骑行午后，</div>
        <div class="poem-verse">国安寺前烟笼。</div>
        <div class="poem-verse">误入竹林中，</div>
        <div class="poem-verse">状元阁顶楼空。</div>
        <div class="poem-verse">归途，归途，</div>
        <div class="poem-verse">夜色沉沉月朦胧。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2024年9月24日于澜悦栖原居</div>
        </div>
