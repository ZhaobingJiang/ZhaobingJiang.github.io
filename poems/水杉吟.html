        <div class="poem-headline">水杉吟</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">晨练畏炎蒸，熔金道欲平。</div>
        <div class="poem-verse">人踪随日绝，鸟语入云凝。</div>
        <div class="poem-verse">河静波如定，林深气自清。</div>
        <div class="poem-verse">千杉持戟立，列阵试新晴！</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵 2025年7月7日于上秦淮湿地公园</div>
      </div>
