        <div class="poem-body">
        <div class="poem-headline">点绛唇 · 小园深秋</div>
        <div class="poem-verse">促织语歇，</div>
        <div class="poem-verse">偶见黄鹂戏残柳。</div>
        <div class="poem-verse">露浓花瘦，</div>
        <div class="poem-verse">轻寒锁深秋。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">小园漫步，</div>
        <div class="poem-verse">薄雨青苔溜。</div>
        <div class="poem-verse">果熟透，</div>
        <div class="poem-verse">推门回首，</div>
        <div class="poem-verse">却把金桂嗅。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2022年10月7日于澜悦栖原</div>
        </div>
      </div>
