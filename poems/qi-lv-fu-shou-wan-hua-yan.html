        <div class="poem-body">
        <div class="poem-headline">七律 · 父寿日游万华岩</div>
        <div class="poem-verse">万华岩畔庆芳辰，古稀父寿伴云行。</div>
        <div class="poem-verse">晶锥垂玉千秋润，飞瀑跳珠甲子清。</div>
        <div class="poem-verse">石笋生春延鹤算，星河载酒宴星灯。</div>
        <div class="poem-verse">烛摇洞府红侵雪，醉揽郴山月满觥！</div>
        </div>
      </div>
