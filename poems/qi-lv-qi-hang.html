        <div class="poem-headline">七律 · 起航</div>
        <div class="poem-verse">欧帕提亚扬帆起，博士群英才智聚。</div>
        <div class="poem-verse">市场广阔映明珠，自研软件创新途。</div>
        <div class="poem-verse">云溪谷中谋发展，万山海域绘新篇。</div>
        <div class="poem-verse">政府鼎力助科技，未来可期展宏图。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2024年7月17日于珠海欧帕提亚</div>
        </div>
      </div>
