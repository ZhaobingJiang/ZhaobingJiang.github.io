        <pre class="poem-body">定风波 · 水墨西湖
 
宿雾敛寒痕渐分，苏堤烟软柳垂纶。
晓色氤氲水墨皴，勾晕，半湖山影半湖云。
何处莺声揉碎春？殷勤，数点新芽破玉尘。
欲蘸孤山雷峰砚，都付，从来淡墨最传神。

 ——江召兵 2025年2月27日于西湖苏堤</pre>
