      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">题北辰宝宝百日照</div>
        <div class="poem-verse">遥望北辰怀未温，</div>
        <div class="poem-verse">空闻梦里啼哭声。</div>
        <div class="poem-verse">忽见飞鸿百岁照，</div>
        <div class="poem-verse">心花怒放酒满樽。</div>
        <div class="poem-blank"></div>
        <div class="poem-note">背景：2009年5月28日从31集团军军部红蓝网上对抗演习归来，见宝宝百日照，狂喜之余，作此诗以抒怀。</div>
        </div>
      </div>
