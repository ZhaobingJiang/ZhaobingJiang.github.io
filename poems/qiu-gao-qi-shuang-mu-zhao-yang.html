        <div class="poem-headline">秋高气爽沐朝阳</div>
        <div class="poem-verse">漫步来到凤凰场。</div>
        <div class="poem-verse">清风拂面心神敞，</div>
        <div class="poem-verse">晨练舒身快意扬。</div>
