        <div class="poem-headline">贺相识半年</div>
        <div class="poem-verse">相识相恋总是缘，</div>
        <div class="poem-verse">千山万水不阻拦。</div>
        <div class="poem-verse">一朝结为秦晋好，</div>
        <div class="poem-verse">相濡以沫到永远。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2006年12月17日</div>
