        <div class="poem-headline">芒果树</div>
        <div class="poem-verse">绿伞圆冠兵营后，</div>
        <div class="poem-verse">惹人黄花大如斗。</div>
        <div class="poem-verse">狂风一夜金落尽，</div>
        <div class="poem-verse">早有青果立枝头。</div>
