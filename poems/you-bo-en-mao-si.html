        <div class="poem-verse">游伯恩茅斯·英伦访学（六）</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">峭立孤崖伯恩欢，</div>
        <div class="poem-verse">十里金滩百鸥翩。</div>
        <div class="poem-verse">云借风生千幅画，</div>
        <div class="poem-verse">浪倚水起万重山。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵，乙未年仲冬</div>
