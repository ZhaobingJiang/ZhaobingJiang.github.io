        <div class="poem-headline">植树</div>
        <div class="poem-verse">春回大地百花香，</div>
        <div class="poem-verse">祥云老幼种树忙。</div>
        <div class="poem-verse">小苗不与桃争春，</div>
        <div class="poem-verse">风雨十年奔梦想。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2020年3月22日于祥云苑</div>
        </div>
