    <section class="section">
      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">榕树</div>
        <div class="poem-verse">楼前一青榕，</div>
        <div class="poem-verse">挺立寒风中。</div>
        <div class="poem-verse">梦想十年后，</div>
        <div class="poem-verse">树底军歌浓。</div>
        <div class="poem-blank"></div>
        <div class="poem-note">背景：道桥连在营建过程中于连队楼前的草地上新种了一棵小榕树，心想小树在全体官兵的照顾下以后肯定会成长为冠状的大树，特作此诗以感悟人生。</div>
        </div>
      </div>
