        <div class="poem-headline">秋风悟世</div>
        <div class="poem-verse">一夜风摇草木惊，寒暑更迭梦初醒。</div>
        <div class="poem-verse">乾坤浩渺闻叶落，世事如烟过眼轻。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2024年9月21日于上秦淮湿地公园</div>
        </div>
