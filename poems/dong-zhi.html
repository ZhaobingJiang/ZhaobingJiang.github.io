        <div class="poem-body">
        <div class="poem-headline">冬至杂感</div>
        <div class="poem-verse">饺子翻滚舞翩迁，</div>
        <div class="poem-verse">家人团聚驱冬寒。</div>
        <div class="poem-verse">新冠肆虐真情在，</div>
        <div class="poem-verse">定留康健在人间。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2022年12月22日（农历十月二十九，冬至）于澜悦栖原居</div>
        </div>
      </div>
