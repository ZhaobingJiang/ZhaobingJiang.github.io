    <section class="section">
      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">生日颂</div>
        <div class="poem-verse">辗转磨难到人间，</div>
        <div class="poem-verse">呱呱坠地四周年。</div>
        <div class="poem-verse">萍踪浪迹无定所，</div>
        <div class="poem-verse">东奔西跑多冷眼。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">咬定青山坚信念，</div>
        <div class="poem-verse">洞明世势亮宝剑。</div>
        <div class="poem-verse">卧薪尝胆再十载，</div>
        <div class="poem-verse">九龙湖畔绘新篇。</div>
        </div>
      </div>
