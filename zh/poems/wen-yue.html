    <section class="section">
      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">问月</div>
        <div class="poem-verse">孤独地</div>
        <div class="poem-verse">静坐在草地上</div>
        <div class="poem-verse">凉风轻拂着树梢</div>
        <div class="poem-verse">我望着月</div>
        <div class="poem-verse">无言</div>
        <div class="poem-verse">寂寞地</div>
        <div class="poem-verse">漂泊在天空中</div>
        <div class="poem-verse">小虫轻唱着歌谣</div>
        <div class="poem-verse">月照着我</div>
        <div class="poem-verse">无语</div>
        <div class="poem-verse">我问</div>
        <div class="poem-verse">为什么</div>
        <div class="poem-verse">你像我一样寂寞   一样孤独</div>
        <div class="poem-verse">月说</div>
        <div class="poem-verse">因为我的心事</div>
        <div class="poem-verse">像你一样多   一样沉</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2000年10月</div>
        </div>
      </div>
