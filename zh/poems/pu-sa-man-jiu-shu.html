        <div class="poem-verse">世事未明增烦恼</div>
        <div class="poem-verse">人情不达多忧患</div>
        <div class="poem-verse">为争自由斗</div>
        <div class="poem-verse">内心默然吼</div>
        <div class="poem-verse">黑夜眼睁开</div>
        <div class="poem-verse">火种心里埋</div>
        <div class="poem-verse">智慧才能展</div>
        <div class="poem-verse">飞高任我看</div>
        <div class="poem-blank"></div>
        <div class="poem-note">谨以此词献给我喜爱的影片 The Shawshank Redemption</div>
