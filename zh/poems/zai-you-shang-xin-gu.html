        <div class="poem-body">
        <div class="poem-headline">再游赏心谷</div>
        <div class="poem-verse">山水绕郭雏菊开，</div>
        <div class="poem-verse">草绿叶黄竞色彩。</div>
        <div class="poem-verse">偷闲半日清风徐，</div>
        <div class="poem-verse">前度江郎今又来。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2022年11月27日于江宁赏心谷</div>
