        <div class="poem-headline">蝶恋花 · 老门东寻蔷薇</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">粉瀑垂檐香沁榭，万叠胭脂，漫作云霞洒。</div>
        <div class="poem-verse">花映雕窗风拂画，游丝轻绕青藤架。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">古巷春深莺语乍，乱点芳菲，悄染眉间夏。</div>
        <div class="poem-verse">绿蔓攀墙说旧话，晴光流转琉璃瓦。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵 2025年4月19日于夫子庙老门东</div>
      </div>
