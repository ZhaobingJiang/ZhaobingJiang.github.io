      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">机房随想</div>
        <div class="essay-subhead">（一）</div>
        <div class="poem-verse">小小四楼一片天，</div>
        <div class="poem-verse">树林郁葱山延绵。</div>
        <div class="poem-verse">昆明难比四季春，</div>
        <div class="poem-verse">温馨如家似港湾。</div>
        <div class="poem-verse">流星一号灼灼闪，</div>
        <div class="poem-verse">浩瀚资料百年看。</div>
        <div class="poem-verse">俯首遍地是黄金，</div>
        <div class="poem-verse">勤奋不足终不见。</div>
        <div class="essay-subhead">（二）</div>
        <div class="poem-verse">时尚流行未曾追，</div>
        <div class="poem-verse">功名利禄不相随。</div>
        <div class="poem-verse">清贫与智慧同在，</div>
        <div class="poem-verse">流星共程序齐辉。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2003年4月</div>
        </div>
      </div>
