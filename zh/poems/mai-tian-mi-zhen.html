      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">麦田迷阵</div>
        <div class="poem-verse">秦淮柳影舞清风，麦浪金黄映日红。</div>
        <div class="poem-verse">鸟语花香人欲醉，白云流水入画中。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">误入麦田深处去，归途已失意朦胧。</div>
        <div class="poem-verse">披荆斩棘寻前路，心内茫然西复东。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">清泉绿萍相映趣，羊肠小道曲径通。</div>
        <div class="poem-verse">麦芒刺附行人足，拨雾开云见碧空。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">终得回归心始放，田园风光意犹浓。</div>
        <div class="poem-verse">往事如梦难寻觅，唯凭理想指前踪。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2024年5月26日于上秦淮秣陵阁</div>
        </div>
      </div>
