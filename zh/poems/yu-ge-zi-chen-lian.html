        <div class="poem-body">
        <div class="poem-headline">渔歌子 · 晨练</div>
        <div class="poem-para">风拂静水惹绿波，鹊鸣翠柳舞细腰。金乌出，光万道，云缀碧空任逍遥。</div>
        <div class="poem-blank"></div>
        <div class="poem-para">远望天印隐佛性，漫步秦淮悟人生。追前事，法先贤，千磨万砺化慧心。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2022年6月30日于上秦淮河畔</div>
        </div>
      </div>
