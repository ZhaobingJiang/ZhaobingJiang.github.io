        <div class="poem-body">
        <div class="poem-headline">轮回之美</div>
        <div class="poem-verse">金辉七彩绘画廊，</div>
        <div class="poem-verse">梧桐叶落亦寻常。</div>
        <div class="poem-verse">秋去冬来春不老，</div>
        <div class="poem-verse">夏夜蛙声满荷塘。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵 2024年11月23日于牛首山</div>
