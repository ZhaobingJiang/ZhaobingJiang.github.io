      <h1 class="name">金秋赴北京有感 <span class="pub-lang">七绝</span></h1>
      <p class="affiliation"><a href="../poems.html">&larr; 返回诗词目录</a></p>

    <section class="section">
      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">金秋赴北京有感</div>
        <div class="poem-verse">京城犹戏水帘洞，</div>
        <div class="poem-verse">金陵却似火焰山。</div>
        <div class="poem-verse">巨龙一晃连两地，</div>
        <div class="poem-verse">有如轻舞芭蕉扇。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">附：</div>
        <div class="poem-para">八月的北京城，秋风送爽，昨晚的一场大雨，又平添了几份凉意；而此时的南京城，却在高温中煎熬。昨天下午从火炉南京来金秋北京，有感。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2020年8月24日于北京工大建国饭店</div>
        </div>
      </div>
