        <div class="poem-headline">临江仙 · 奉天冬意</div>
        <div class="poem-verse">奉天城下冬意浓，银杏叶黄秋已终。</div>
        <div class="poem-verse">万物凋零霜满空。</div>
        <div class="poem-verse">寒鸦几点，斜阳外，暮云重。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">星夜赶路心如火，行囊收拾赴新程。</div>
        <div class="poem-verse">天高云淡志凌云。</div>
        <div class="poem-verse">风尘仆仆，路漫漫，意气雄。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2024年10月31日于桃仙机场</div>
        </div>
      </div>
