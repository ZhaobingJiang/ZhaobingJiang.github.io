      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">栖原新雨</div>
        <div class="poem-verse">新树笼白雾，粉樱饰绿珠。</div>
        <div class="poem-verse">黄蕊红瓣处，湿径意踯躅。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">杳杳方山曙，啾啾杜鹃语。</div>
        <div class="poem-verse">幽兰人不锄，窗前静读书。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2021年3月28日于澜悦栖原居</div>
        </div>
      </div>
