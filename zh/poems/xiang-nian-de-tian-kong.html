    <section class="section">
      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">想念的天空</div>
        <div class="poem-verse">轻快的心情</div>
        <div class="poem-verse">如今,负载着你的倩影</div>
        <div class="poem-verse">平静的梦境</div>
        <div class="poem-verse">而又,充盈着你的声音</div>
        <div class="poem-verse">晚上闪烁的星星</div>
        <div class="poem-verse">是你明亮的眼睛</div>
        <div class="poem-verse">在你周身清新的空气</div>
        <div class="poem-verse">是我对你的感情</div>
        <div class="poem-verse">不奢求</div>
        <div class="poem-verse">你会偶尔想起我</div>
        <div class="poem-verse">只奢望</div>
        <div class="poem-verse">相遇时</div>
        <div class="poem-verse">你还会记得我</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2002年11月</div>
        </div>
      </div>
      <p class="poem-pager"><a class="pub-dl" href="./ni-de-yan-jing.html">&larr; 你的眼睛</a>&nbsp;&nbsp;|&nbsp;&nbsp;<a class="pub-dl" href="./yi-qi-zou-guo-de-ri-zi.html">一起走过的日子 &rarr;</a></p>
