      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">我的自画像</div>
        <div class="poem-verse">狂傲是本性，</div>
        <div class="poem-verse">不屈乃精神。</div>
        <div class="poem-verse">柔情满襟怀，</div>
        <div class="poem-verse">谁人识我心？</div>
        <div class="poem-blank"></div>
        <div class="poem-note">注：我的导师吴锤结教授为我的诗添加后两句，</div>
        <div class="poem-note">在此为他的”点睛之笔“表示十分的感谢！</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2003年11月</div>
        </div>
      </div>
