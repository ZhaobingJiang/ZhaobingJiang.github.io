        <div class="poem-headline">虞美人 · 游南唐二陵有感</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">枫红苔滑霜痕重，寂寞松声动。断垣残壁诉流年，空余古木苍烟锁寒天。</div>
        <div class="poem-verse">后主悲歌情何限，命运随风转。江山易改故人非，唯有词章千载泪痕鲜。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵 2024年12月7日于南唐二陵</div>
      </div>
