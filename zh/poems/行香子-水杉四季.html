      <div class="poem">
        <pre class="poem-body">行香子 · 水杉四季

春涧调弦，夏羽梳翎。
立青霄水畔亭亭。
云台山影，严渡舟横。
染一襟烟，一襟翠，一襟晴。

秋霜淬色，冬霞燃炬。
任星霜漫转空庭。
布谷声幽，白鹭衣轻。
醉林中静，风中谧，月中明。

 ——江召兵 2025年9月23日于上秦淮湿地公园</pre>
