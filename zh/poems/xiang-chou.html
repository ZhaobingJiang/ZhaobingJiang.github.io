      <p class="affiliation"><a href="../poems.html">&larr; 返回诗词目录</a></p>
    </div>
    <section class="section">
      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">乡愁</div>
        <div class="poem-verse">是圆圆的、辣辣的</div>
        <div class="poem-verse">那一碗猪肉粉就是解药</div>
        <div class="poem-verse">嗦粉</div>
        <div class="poem-verse">那是灵魂与味蕾的碰撞</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">是清冽的、甜甜的</div>
        <div class="poem-verse">那一捧山泉水就是解药</div>
        <div class="poem-verse">吃水</div>
        <div class="poem-verse">那是眼眸与蓝天的对视</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">是新鲜的、冷冽的</div>
        <div class="poem-verse">那一座后龙山就是解药</div>
        <div class="poem-verse">捡菌</div>
        <div class="poem-verse">那是寻觅与兴奋的融合</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">乡愁哦</div>
        <div class="poem-verse">长短各异、扁圆不同</div>
        <div class="poem-verse">丝丝缕缕、枝枝蔓蔓</div>
        <div class="poem-verse">魂牵梦绕、欲远还近</div>
        <div class="poem-verse">一直都萦绕在每个人的心田</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2022年7月22日于长沙好来登酒店</div>
        </div>
      </div>
