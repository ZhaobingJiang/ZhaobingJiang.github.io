        <div class="poem-body">
        <div class="poem-headline">晨</div>
        <div class="poem-verse">河川静谧鸣声起，</div>
        <div class="poem-verse">月华皎洁曦光明。</div>
        <div class="poem-verse">心怀梦想向远方，</div>
        <div class="poem-verse">攀峰摘星不畏辛。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2023年11月2日于上秦淮湿地公园</div>
        </div>
