      <div class="poem">
        <pre class="poem-body">蝶恋花 · 牡丹亭之梦中情

后园花胜春已过。
雨霁云空，
万点胭脂堕。
燕子归来寻旧罗。
东风吹散香尘锁。

满地残红人懒卧。
绿掩池塘，
几度斜阳破。
惆怅韶华浑似我。
相逢只待江南柯。

 ——江召兵 2023年5月2日于澜悦栖原居</pre>
