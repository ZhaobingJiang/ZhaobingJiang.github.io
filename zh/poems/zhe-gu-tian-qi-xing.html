        <div class="poem-body">
        <div class="poem-headline">鹧鸪天 · 骑行</div>
        <div class="poem-para">伏案久坐意阑珊，冗务缠身鬓已斑。心为浮名常嗟叹，何似骑行展欢颜。</div>
        <div class="poem-blank"></div>
        <div class="poem-para">迎微风，拂柳边，一抹斜阳映半天。世事纷繁抛脑后，唯留豪气荡心间。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵 2024年7月4日于上秦淮湿地公园</div>
        </div>
