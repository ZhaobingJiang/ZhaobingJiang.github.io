        <div class="poem-headline">满庭芳 · 赏南理工二月兰</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">紫雾浮空，幽香漫野，钟山南麓春浓。</div>
        <div class="poem-verse">黛色擎天，杉影蔽苍穹。</div>
        <div class="poem-verse">谁泼柔蓝万顷，烟纱里、浅碧深红。</div>
        <div class="poem-verse">溪雾湿流光，恍若画屏中。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">黉门承文脉，诗碑隐翠，弦歌递风。</div>
        <div class="poem-verse">更紫金草语，暗寄芳踪。</div>
        <div class="poem-verse">书香漫过花信，苔阶悄立芳丛。</div>
        <div class="poem-verse">凝眸处，一园霞霭，万象此间逢。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵 2025年3月13日于南理工校园</div>
      </div>
