      <p class="affiliation"><a href="../poems.html">&larr; 返回诗词目录</a></p>
    </div>
    <section class="section">
      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">雪</div>
        <div class="poem-verse">不带任何声息</div>
        <div class="poem-verse">就这样扬扬洒洒</div>
        <div class="poem-verse">把大地这颗心</div>
        <div class="poem-verse">用冰冷裹住</div>
        <div class="poem-verse">用冷酷包围</div>
        <div class="poem-verse">那白白的覆盖</div>
        <div class="poem-verse">可是我心生的老茧</div>
        <div class="poem-verse">在三月的季节里</div>
        <div class="poem-verse">只露出模糊的浅绿</div>
        <div class="poem-verse">大地的默默</div>
        <div class="poem-verse">在沉睡中把力量积蓄</div>
        <div class="poem-verse">春风的温暖</div>
        <div class="poem-verse">必定化作醉人的绿意</div>
        <div class="poem-verse">在心中永远珍藏</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2005年1月</div>
        </div>
      </div>
