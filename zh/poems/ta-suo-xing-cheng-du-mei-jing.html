        <div class="poem-body">
        <div class="poem-headline">踏莎行 · 成都（美景篇）</div>
        <div class="poem-verse">柳外莺啼，</div>
        <div class="poem-verse">花间蝶舞。</div>
        <div class="poem-verse">春光已过芳菲暮。</div>
        <div class="poem-verse">东风吹雨又来时，</div>
        <div class="poem-verse">七彩脸谱争妍处。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">燕子衔泥，</div>
        <div class="poem-verse">蜂儿弄絮。</div>
        <div class="poem-verse">绿荫深院人远去。</div>
        <div class="poem-verse">杜甫草堂盈忧患，</div>
        <div class="poem-verse">武侯祠前久凝伫。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2023年4月19日于成都</div>
        </div>
      </div>
