      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">湖光春色</div>
        <div class="poem-verse">清风拂面柳丝新，</div>
        <div class="poem-verse">白鹭翩飞惹波痕。</div>
        <div class="poem-verse">樱瓣零落莫惆怅，</div>
        <div class="poem-verse">却见牡丹苞蕊深。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵 2024年4月14日于九龙湖南湖公园</div>
        </div>
