      <p class="affiliation"><a href="../poems.html">&larr; 返回诗词目录</a></p>

      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">晨游上秦淮湿地公园</div>
        <div class="poem-verse">世网牵形役，心尘久自封。</div>
        <div class="poem-verse">晨兴步幽渚，空濛见远峰。</div>
        <div class="poem-verse">旭照芳甸秀，凉侵晓露浓。</div>
        <div class="poem-verse">灯盏凝晴艳，木槿谢还荣。</div>
        <div class="poem-verse">鹧鸪穿密筱，喜鹊戏高松。</div>
        <div class="poem-verse">逝水衔霞色，清辉泛彩虹。</div>
        <div class="poem-verse">慧瓶涤垢念，虚襟纳远钟。</div>
        <div class="poem-verse">悠然得真趣，长啸伴云鸿。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2025年8月28日于上秦淮湿地公园</div>
        </div>
      </div>
