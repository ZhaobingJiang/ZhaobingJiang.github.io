        <div class="poem-body">
        <div class="poem-headline">行香子 · 水杉四季</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">春涧调弦，夏羽梳翎。</div>
        <div class="poem-verse">立青霄水畔亭亭。</div>
        <div class="poem-verse">云台山影，严渡舟横。</div>
        <div class="poem-verse">染一襟烟，一襟翠，一襟晴。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">秋霜淬色，冬霞燃炬。</div>
        <div class="poem-verse">任星霜漫转空庭。</div>
        <div class="poem-verse">布谷声幽，白鹭衣轻。</div>
        <div class="poem-verse">醉林中静，风中谧，月中明。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2025年9月23日于上秦淮湿地公园</div>
      </div>
