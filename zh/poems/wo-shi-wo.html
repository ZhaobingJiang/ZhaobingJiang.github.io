    <section class="section">
      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">我是我</div>
        <div class="poem-verse">生性狂傲</div>
        <div class="poem-verse">骋无垠旷野</div>
        <div class="poem-verse">荆棘藤葛脚下穿</div>
        <div class="poem-verse">高山激水如平原</div>
        <div class="poem-verse">层峦叠嶂手中扇</div>
        <div class="poem-verse">持坚韧精神</div>
        <div class="poem-verse">握无敌武艺</div>
        <div class="poem-verse">勇敢角斗士</div>
        <div class="poem-verse">智慧赛诸葛</div>
        <div class="poem-verse">敢于天下博</div>
        <div class="poem-verse">珠穆朗玛压不屈</div>
        <div class="poem-verse">长江黄河挡不住</div>
        <div class="poem-verse">风雨雷电催不垮</div>
        <div class="poem-verse">要以我顽强生命</div>
        <div class="poem-verse">横亘与天地间</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2004年9月</div>
        </div>
      </div>
