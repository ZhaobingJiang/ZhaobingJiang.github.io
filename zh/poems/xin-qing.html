        <div class="poem-body">
        <div class="poem-headline">心情</div>
        <div class="poem-verse">机缘偶遇壮志稠，</div>
        <div class="poem-verse">夜夜梦中下广州，</div>
        <div class="poem-verse">取得移山聚宝经，</div>
        <div class="poem-verse">也学范蠡不系舟。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵于二O一八年九月十九日早赴广州前</div>
        </div>
