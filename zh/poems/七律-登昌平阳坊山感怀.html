        <pre class="poem-body">七律 · 登昌平阳坊山感怀

云纱漫卷隐峥嵘，古木森森碧浪重。
石径斜攀苍霭里，亭台遥立翠微中。
千岩竞秀擎天剑，万壑争流动地风。
回首征途迷雾散，一山春雨一山虹。

 ——江召兵 2025年8月29日于北京昌平区阳坊镇</pre>
