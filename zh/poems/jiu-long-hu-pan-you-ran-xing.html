      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">九龙湖畔悠然行</div>
        <div class="poem-verse">柳丝轻舞处，草绿散清香。</div>
        <div class="poem-verse">水畔闻蛙响，风轻云影长。</div>
        <div class="poem-verse">芦中隐鹭影，鸳鸯戏波光。</div>
        <div class="poem-verse">心远天地阔，悠然自安详。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2024年4月6日清明节假期于九龙湖畔</div>
        </div>
