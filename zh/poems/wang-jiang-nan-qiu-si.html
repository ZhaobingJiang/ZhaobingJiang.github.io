        <div class="poem-headline">望江南 · 秋思</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">牡丹谢，秋菊又芬芳。绿波吹皱秋风起，舔瘦秋词意更长。弯月挂山冈。</div>
        <div class="poem-verse">杨柳黄，休要悲秋凉。疏枝朗干映晴空，远山如黛入眸光。人间百态藏。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵 2024年9月30日于澜悦栖原居</div>
