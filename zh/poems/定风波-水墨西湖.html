        <div class="poem-headline">定风波 · 水墨西湖</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">宿雾敛寒痕渐分，苏堤烟软柳垂纶。</div>
        <div class="poem-verse">晓色氤氲水墨皴，勾晕，半湖山影半湖云。</div>
        <div class="poem-verse">何处莺声揉碎春？殷勤，数点新芽破玉尘。</div>
        <div class="poem-verse">欲蘸孤山雷峰砚，都付，从来淡墨最传神。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵 2025年2月27日于西湖苏堤</div>
