        <div class="poem-body">
        <div class="poem-headline">蝶恋花 · 梅山晴日探春</div>
        <div class="poem-verse">谁遣东君先破冻？</div>
        <div class="poem-verse">暖律初回，万树胭脂涌。</div>
        <div class="poem-verse">粉白嫣红争献宠，蓝天如洗香云拥。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">携幼穿花人接踵。</div>
        <div class="poem-verse">笑靥盈盈，醉与芳菲共。</div>
        <div class="poem-verse">摄尽春光归画笼，归来犹觉馨盈梦。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵 2026年2月14日于南京梅花山</div>
        </div>
      </div>
