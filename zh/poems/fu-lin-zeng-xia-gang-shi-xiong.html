        <div class="poem-headline">伏鳞——赠夏刚师兄</div>
        <div class="poem-sign">——赠夏刚师兄</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">蛰龙隐寒原，肃气结重霜。</div>
        <div class="poem-verse">韬光晦深谷，敛迹隐苍茫。</div>
        <div class="poem-verse">蓄势千钧劲，涵精百炼钢。</div>
        <div class="poem-verse">静待风雷动，冲天振八荒。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2025年4月12日</div>
        </div>
