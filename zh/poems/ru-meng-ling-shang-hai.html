        <div class="poem-headline">如梦令 · 上海</div>
        <div class="poem-verse">昨夜赴沪游玩，</div>
        <div class="poem-verse">迎风黄陂南站。</div>
        <div class="poem-verse">更加美味辣餐，</div>
        <div class="poem-verse">直把手艺赞。</div>
        <div class="poem-verse">惊叹，惊叹，</div>
        <div class="poem-verse">胜似天上人间。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2003年2月</div>
