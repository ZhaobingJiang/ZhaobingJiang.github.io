        <div class="poem-headline">采桑子（罗敷媚）· 读书</div>
        <div class="poem-verse">年少不知书滋味，不稼不穑，百无聊赖，斧劈华山山未开。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">人生不惑始读书，经史子集，古今中外，源头活水水自来。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2022年5月4日（五四青年节）于澜悦栖原居</div>
