      <div class="poem">
        <div class="essay-body">
        <div class="poem-headline">感悟</div>
        <div class="poem-verse">不惑之龄弱冠心，</div>
        <div class="poem-verse">心怀远方望星辰。</div>
        <div class="poem-verse">人生几何如朝露，</div>
        <div class="poem-verse">且将岁月赋骚人。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2023年11月2日于澜悦栖原居</div>
        <div class="poem-blank"></div>
        <div class="poem-note">注：</div>
        <div class="poem-note">“对酒当歌，人生几何！譬如朝露，去日苦多。”（曹操《短歌行》）</div>
        </div>
      </div>
