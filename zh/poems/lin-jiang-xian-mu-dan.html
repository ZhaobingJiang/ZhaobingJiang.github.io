        <div class="poem-headline">临江仙 · 牡丹</div>
        <div class="poem-verse">忆当年牡丹开后，</div>
        <div class="poem-verse">春风几度相逢。</div>
        <div class="poem-verse">玉人入梦倚芳丛。</div>
        <div class="poem-verse">露华娇欲滴珠红。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">今夜月明花影里，</div>
        <div class="poem-verse">满亭香雾朦胧。</div>
        <div class="poem-verse">金陵剧院话匆匆。</div>
        <div class="poem-verse">碧云天外路千重。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2023年5月4日于澜悦栖原居</div>
        </div>
