      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">澜悦栖原之春</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">澜悦女贞闹春意，</div>
        <div class="poem-verse">栖原石楠处处新。</div>
        <div class="poem-verse">最是山茶红胜火，</div>
        <div class="poem-verse">点点海棠悦心情。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2020年3月16日于五矿澜悦栖原居</div>
        <div class="poem-blank"></div>
        <div class="poem-note">注：澜悦栖原居小区有女贞树、石楠树、山茶、垂丝海棠、紫玉兰、结香、紫叶李等植物，目不暇接、数不胜数。</div>
      </div>
