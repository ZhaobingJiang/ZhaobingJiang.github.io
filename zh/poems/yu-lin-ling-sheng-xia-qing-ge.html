        <div class="poem-body">
        <div class="poem-headline">雨霖铃 · 盛夏清歌</div>
        <div class="poem-para">盛夏清歌，朝霞辉映，绿意盈园。微风轻抚心弦静，闲漫步，气定神闲。日照碧波荡漾处，鱼戏水云间。鸟鸣脆，和乐融融，万物生辉映晴天。</div>
        <div class="poem-blank"></div>
        <div class="poem-para">凌云壮志今重燃，儿时梦，再度展鹏翰。豪情未减当年勇，新征程，勇往直前。花开正盛，心中热血谁能比肩？！待来日功成名就，笑语话当年。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2024年7月21日于上秦淮湿地公园</div>
        </div>
      </div>
