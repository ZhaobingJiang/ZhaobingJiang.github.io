      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">过韶山</div>
        <div class="poem-verse">苍山未改旧时青，溪涧潺湲泉自泠。</div>
        <div class="poem-verse">千畴雨润禾犹绿，一勺波摇影尚清。</div>
        <div class="poem-verse">勋业已随云影淡，松涛仍作海潮听。</div>
        <div class="poem-verse">行人莫问荣枯事，但看星斗万古荧。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵 2025年7月18日于韶山冲</div>
        </div>
      </div>
