        <div class="poem-headline">鹧鸪天 · 烟火裁诗一日闲</div>
        <div class="poem-verse">双毂追风晓色鲜，云台青泻半湖烟。</div>
        <div class="poem-verse">悠波鹭点菱花碎，曲栈苔深树影连。</div>
        <div class="poem-verse">收暑浪，采瓜园，稚儿抱玉笑成弯。</div>
        <div class="poem-verse">忽闻密樾声声慢：知是鹧鸪催晚餐？</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2025年7月26日于澜悦栖原居</div>
        </div>
