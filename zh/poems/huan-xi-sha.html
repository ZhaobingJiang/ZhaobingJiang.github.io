        <div class="poem-body">
        <div class="poem-headline">浣溪沙</div>
        <div class="poem-verse">寒风侵肌肤欲裂，冷霜袭头发愈白，人生何须天门开？！</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">河岗青青杨柳绿，西湖迢迢蠡公在，梅妻鹤子采菊来。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2022年5月1日于澜悦栖原居</div>
        </div>
      </div>
