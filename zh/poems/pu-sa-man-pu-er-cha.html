        <div class="poem-headline">菩萨蛮 · 普洱茶</div>
        <div class="poem-verse">山中草木皆知己，</div>
        <div class="poem-verse">茶香醇厚人情美。</div>
        <div class="poem-verse">浓郁滴琅琊，</div>
        <div class="poem-verse">玉瓯浮翠葩。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">暖烟笼宝焙，</div>
        <div class="poem-verse">金饼初试翻。</div>
        <div class="poem-verse">雪乳泛轻芽，</div>
        <div class="poem-verse">回味帝王家。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2023年6月2日于澜悦栖原居</div>
