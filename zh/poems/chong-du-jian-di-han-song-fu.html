      <div class="poem">
        <div class="essay-body">
        <div class="poem-headline">重读《涧底寒松赋》有感</div>
        <div class="poem-verse">人言篱间物，</div>
        <div class="poem-verse">实为涧底松。</div>
        <div class="poem-verse">历久弥新事，</div>
        <div class="poem-verse">不在倏然中。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2023年2月18日于澜悦栖原居</div>
        <div class="poem-blank"></div>
        <div class="poem-note">注：</div>
        <div class="poem-note">（1）篱间物：喻为普通之物，出自《世说新语 · 排调》“如其不尔，篱壁间物亦不可得也。”</div>
        <div class="poem-note">（2）涧底松：出自王勃《涧底寒松赋》，表示高才俊士。</div>
        </div>
      </div>
