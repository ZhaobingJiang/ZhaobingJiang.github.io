        <div class="poem-headline">定风波 · 初秋骑行</div>
        <div class="poem-verse">风爽云低秋渐浓，单车轻踏晓烟中。</div>
        <div class="poem-verse">一路繁花迎客笑，娇俏，清芬袭袂气葱茏。</div>
        <div class="poem-verse">归未湿衣天作美，称意，一帘秋雨一帘风。</div>
        <div class="poem-verse">闲斟玲珑杯盏暖，香满，茶烟袅袅与秋融。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2026年8月9日于秦淮河畔骑行归来</div>
        </div>
