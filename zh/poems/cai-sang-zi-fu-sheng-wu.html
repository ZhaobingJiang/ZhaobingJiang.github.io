        <div class="poem-headline">采桑子 · 浮生悟</div>
        <div class="poem-verse">拼尽浮生谋出头，世事纷繁，勇立潮边，灯红酒绿如云烟。</div>
        <div class="poem-verse">回首来时路漫漫，富不封缄，贵亦难言，空相自在最悠然。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵 2024年6月30日于澜悦栖原居</div>
