        <div class="poem-body">
        <div class="poem-headline">江城子 · 偕志越兄同登山海关</div>
        <div class="poem-verse">少年意气共戎装。淬风霜，砺锋芒。</div>
        <div class="poem-verse">几许闲争，一笑付沧浪。</div>
        <div class="poem-verse">廿七星霜催鬓雪，情愈烈，酒弥香。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">张弓同指海云乡，志初偿，越重冈。</div>
        <div class="poem-verse">雄关共赋，鳞甲动朝阳。</div>
        <div class="poem-verse">龙影长悬肝胆照，携游处，山海长。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵+DeepSeek 2025年12月25日于山海关</div>
        </div>
      </div>
