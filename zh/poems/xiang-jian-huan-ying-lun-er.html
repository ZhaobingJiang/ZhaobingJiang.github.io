        <div class="poem-headline">相见欢 · 英伦访学（二）</div>
        <div class="poem-verse">寒风忧愁脑后，</div>
        <div class="poem-verse">独自游。</div>
        <div class="poem-verse">冬雨飘零晶莹似金油。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">树冠广，</div>
        <div class="poem-verse">落叶黄，</div>
        <div class="poem-verse">不停留。</div>
        <div class="poem-verse">如梦人生激荡几春秋？</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵，乙未年仲冬</div>
