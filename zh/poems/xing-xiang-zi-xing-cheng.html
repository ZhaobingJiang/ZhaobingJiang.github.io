        <div class="poem-body">
        <div class="poem-headline">行香子 · 兴城深秋感怀</div>
        <div class="poem-verse">木叶鎏金，珠果悬彤。</div>
        <div class="poem-verse">恰西风、巧绘秋容。</div>
        <div class="poem-verse">三礁雪浪，一桁灯红。</div>
        <div class="poem-verse">更枫酡颊，云酲靥，海澄瞳。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">信步城阙，骋目溟鸿。</div>
        <div class="poem-verse">笑年来、何处相逢？</div>
        <div class="poem-verse">沧波影里，兴市楼东。</div>
        <div class="poem-verse">但诗难工，画难拟，兴难穷。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2025年11月6日于辽宁兴城市</div>
        </div>
      </div>
