        <div class="poem-body">
        <div class="poem-headline">故乡</div>
        <div class="poem-verse">故乡情怀思不尽，石路柏树古韵存。</div>
        <div class="poem-verse">儿时记忆如昨日，笔花祠堂凝神魂。</div>
        <div class="poem-verse">凉亭傲然绿荫处，冬暖夏凉古井温。</div>
        <div class="poem-verse">童年欢笑声声在，后龙山上忙捡菌。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2023年4月16日（补4月5日农历二月十五清明节老家祭祖见闻感想）</div>
        </div>
