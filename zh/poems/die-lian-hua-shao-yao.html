      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">蝶恋花 · 芍药花开</div>
        <div class="poem-verse">芍为花王艳含羞。</div>
        <div class="poem-verse">轻启朱唇，</div>
        <div class="poem-verse">似与佳人候。</div>
        <div class="poem-verse">睡起妆慵娇欲留。</div>
        <div class="poem-verse">东风已把春吹瘦。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">玉面天然谁得偶。</div>
        <div class="poem-verse">只合含芳，</div>
        <div class="poem-verse">独殿群妍后。</div>
        <div class="poem-verse">何事多情偏爱酒。</div>
        <div class="poem-verse">十里秦淮难消受。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2023年5月12日于澜悦栖源居</div>
        </div>
      </div>
