      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">高考后抒情组诗</div>
        <div class="essay-subhead">（一）</div>
        <div class="poem-verse">漫漫长夜幽梦远，</div>
        <div class="poem-verse">浓浓白昼苦期盼。</div>
        <div class="poem-verse">却道何事煎心肠，</div>
        <div class="poem-verse">金榜提名会有缘。</div>
        <div class="essay-subhead">（二）</div>
        <div class="poem-verse">多年心血聚一卷，</div>
        <div class="poem-verse">倚门秋水亦望穿。</div>
        <div class="poem-verse">试问金桂何时有，</div>
        <div class="poem-verse">待到八月天下欢。</div>
        <div class="essay-subhead">（三）</div>
        <div class="poem-verse">数几代希望所归，十二年忍辱负重。</div>
        <div class="poem-verse">心事重重向谁诉，倦倚西风盼飞鸿。</div>
        <div class="poem-verse">泪洒枕巾霜露浓，夜半忽醒梦也空。</div>
        <div class="poem-verse">人生自古多坎坷，试问谁人是英雄？</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵1998年8月</div>
        </div>
      </div>
