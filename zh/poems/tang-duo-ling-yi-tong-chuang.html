        <div class="poem-body">
        <div class="poem-headline">唐多令 · 忆同窗</div>
        <div class="poem-para">巨樟映操场，皓月照南楼。梦回时、共话心头。秋风拂面情依旧，笑语朗，意悠悠。</div>
        <div class="poem-para">岁月似分流，南辕与北舟。各西东、风景难留。欲醉还休思旧友，终不似，少年游。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2024年9月28日于澜悦栖原居</div>
        </div>
      </div>
