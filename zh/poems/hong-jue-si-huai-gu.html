      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">禅遇</div>
        <div class="poem-verse">意欲南唐访二陵，朝霞初绽锁门庭。</div>
        <div class="poem-verse">深山幽藏宏觉寺，钟磬艾香远俗情。</div>
        <div class="poem-verse">清风拂面穿林隙，心净如水云亦轻。</div>
        <div class="poem-verse">禅烟缭绕添端午，菩提树下悟心经。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2024年6月10日（端午节）于宏觉禅寺</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">深山藏古寺，静谧远尘嚣。</div>
        <div class="poem-verse">清风拂面过，心静自逍遥。</div>
        <div class="poem-verse">偶入宏觉地，禅音绕耳飘。</div>
        <div class="poem-verse">菩提明悟处，慧根渐生苗。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2024年6月10日于宏觉禅寺</div>
        </div>
      </div>
