      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">别后怀烟台友人</div>
        <div class="poem-sign">——仿谢眺《别江水曹》</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">丹崖悬阁处，列岫抱仙寰。</div>
        <div class="poem-verse">云涌八仙渡，潮生月亮湾。</div>
        <div class="poem-verse">盛筵携稚子，高谊动烟鬟。</div>
        <div class="poem-verse">踏浪采灵贝，寻幽访蜃澜。</div>
        <div class="poem-verse">醉里烟霞客，长歌共忘还。</div>
        <div class="poem-verse">别后听潮夜，清辉满鲁天。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵+DeepSeek 2025年8月23日于澜悦栖原居</div>
        </div>
      </div>
