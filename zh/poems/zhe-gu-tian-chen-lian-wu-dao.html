        <div class="poem-headline">鹧鸪天 · 晨练悟道</div>
        <div class="poem-para">露珠晶莹黄鹂鸣，水涨秦淮沙洲盈。合欢花落紫薇绽，拱桥倒影漾波清。</div>
        <div class="poem-blank"></div>
        <div class="poem-para">思往昔，忆勇拼，阴阳融合太极盈。顺势而为乘势上，人生真谛此心明。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2024年9月1日于上秦淮湿地公园</div>
        </div>
      </div>
