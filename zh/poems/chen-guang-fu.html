      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">尘光赋</div>
        <div class="poem-verse">柴米油盐酝墨香，晨昏流转觅辉光。</div>
        <div class="poem-verse">灵心玉润凡尘事，步履匆匆自悠扬。</div>
        <div class="poem-verse">人间烟火入诗境，岁月寻常酿玉浆。</div>
        <div class="poem-verse">琐碎非笼凭慧手，平凡有韵灵眸藏。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2025年6月16日于银城INC中心</div>
        </div>
      </div>
