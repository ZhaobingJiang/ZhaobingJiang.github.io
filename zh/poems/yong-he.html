      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">咏荷</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">盛夏清香袭九霄，</div>
        <div class="poem-verse">寒冬犹有霜枝摇。</div>
        <div class="poem-verse">淤泥未侵玉臂卧，</div>
        <div class="poem-verse">清涟难改孤标傲。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵（2018.07.04）</div>
        <div class="poem-blank"></div>
        <div class="poem-note">注：</div>
        <div class="poem-note">1. 芳气袭人是酒香；</div>
        <div class="poem-note">2.已是悬崖万丈冰，犹有花枝俏；</div>
        <div class="poem-note">3.出淤泥而不染， 濯清涟而不妖；</div>
        <div class="poem-note">4.孤标傲世偕谁隐，一样花开为底迟。</div>
      </div>
      </div>
