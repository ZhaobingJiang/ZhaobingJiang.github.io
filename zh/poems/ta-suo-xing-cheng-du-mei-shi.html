        <div class="poem-body">
        <div class="poem-headline">踏莎行 · 成都（美食篇）</div>
        <div class="poem-verse">蜀锦笼烟，</div>
        <div class="poem-verse">吴绫织雾。</div>
        <div class="poem-verse">江南美食人争慕。</div>
        <div class="poem-verse">谁知此地有佳名，</div>
        <div class="poem-verse">不辞蜀道留香住。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">玉箸垂红，</div>
        <div class="poem-verse">金盘叠素。</div>
        <div class="poem-verse">绿蚁琥珀推还欲。</div>
        <div class="poem-verse">从今莫负好风光，</div>
        <div class="poem-verse">只消醉卧花荫处。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2023年4月19日于成都</div>
        </div>
      </div>
