        <div class="poem-headline">临江仙 · 题中山植物园“莫奈花园”</div>
        <div class="poem-verse">钟山南麓晴光好，近邻梅雪香初透。</div>
        <div class="poem-verse">烟纱漫卷郁金丛，胭脂深浅，摇曳碧玲珑。</div>
        <div class="poem-verse">争与丹青酣醉处，偏教移入芳踪。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">谁摹溪雾三分韵，琉璃浅漾春浓。</div>
        <div class="poem-verse">一园霞色未穷，迷离眸底，万象画图中。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2025年3月13日于中山植物园南园</div>
        </div>
      </div>
