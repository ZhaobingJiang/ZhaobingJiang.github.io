    <section class="section">
      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">偶见</div>
        <div class="poem-verse">惊讶回首间</div>
        <div class="poem-verse">两片绚丽的彩霞</div>
        <div class="poem-verse">抹上她美丽的脸颊</div>
        <div class="poem-verse">那可是一对金色的月牙</div>
        <div class="poem-verse">是谁</div>
        <div class="poem-verse">不小心洒落了</div>
        <div class="poem-verse">圣母桌上的玉液琼酿</div>
        <div class="poem-verse">滴滴散在我的心上</div>
        <div class="poem-verse">辣得我心伤</div>
        <div class="poem-verse">长长的睫毛</div>
        <div class="poem-verse">遗忘的</div>
        <div class="poem-verse">可是深秋冰冷的霜</div>
        <div class="poem-verse">我心里禁不住问</div>
        <div class="poem-verse">难道初冬寒冷的风</div>
        <div class="poem-verse">能把烦恼的波光</div>
        <div class="poem-verse">吹向我心爱的姑娘</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2001年11月</div>
        </div>
      </div>
