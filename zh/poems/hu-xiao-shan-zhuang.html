      <p class="affiliation"><a href="../poems.html">&larr; 返回诗词目录</a></p>
    </div>
    <section class="section">
      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">我的呼啸山庄</div>
        <div class="poem-verse">现实的沉闷</div>
        <div class="poem-verse">有你的陪伴</div>
        <div class="poem-verse">呼啸山庄</div>
        <div class="poem-verse">使我能听到</div>
        <div class="poem-verse">真正狂风暴雨的声响</div>
        <div class="poem-verse">那是我平静的表面下</div>
        <div class="poem-verse">内心深处的激荡</div>
        <div class="poem-verse">压抑的狂妄</div>
        <div class="poem-verse">在字间快速流淌</div>
        <div class="poem-verse">活力的渴望</div>
        <div class="poem-verse">在句中猛然释放</div>
        <div class="poem-verse">这是我心的跳动</div>
        <div class="poem-verse">肺的呼吸</div>
        <div class="poem-verse">这是我本我的怒哄</div>
        <div class="poem-verse">心灵的震荡</div>
        <div class="poem-verse">体验天然疯狂</div>
        <div class="poem-verse">获取心灵安祥</div>
        </div>
      </div>
