      <div class="poem">
        <div class="essay-body">
        <div class="poem-headline">闲适——寄东坡先生</div>
        <div class="poem-sign">——初读《苏轼选集》（王水照选注）有感</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">心宽天愈高，云淡日初长。</div>
        <div class="poem-verse">事闲清风至，无为任疏狂。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">陶潜何须问，东篱菊正黄。</div>
        <div class="poem-verse">儒行践道义，释理净尘心。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">道履踏清霜，禅机悟万象。</div>
        <div class="poem-verse">坡仙学无碍，三教自融光。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">遥望碧空远，闲吟山水旁。</div>
        <div class="poem-verse">此生何所寄，诗酒任徜徉。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2024年3月12日于千人大厦</div>
        </div>
      </div>
