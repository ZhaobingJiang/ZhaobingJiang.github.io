        <div class="poem-headline">月光恋曲</div>
        <div class="poem-verse">窗外的月光</div>
        <div class="poem-verse">透过树的阻挡</div>
        <div class="poem-verse">温柔地</div>
        <div class="poem-verse">洒在我的身上</div>
        <div class="poem-verse">那是不是你脉脉的</div>
        <div class="poem-verse">目光</div>
        <div class="poem-verse">携带你浓浓的</div>
        <div class="poem-verse">思念</div>
        <div class="poem-verse">轻轻抚平</div>
        <div class="poem-verse">我昨日的创伤</div>
        </div>
