        <div class="poem-headline">鹧鸪天 · 紫金山挖野蒜</div>
        <div class="poem-para">浮生偷闲半日闲，野蒜丛生荷锄欢。二月兰花争春艳，数声鹧鸪唤晴川。</div>
        <div class="poem-blank"></div>
        <div class="poem-para">溪水清，白云绵，小桥流水共潺湲。心随春律轻盈舞，望眼何须羡万权。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2024年3月21日于紫金山邮局路附近</div>
        </div>
      </div>
