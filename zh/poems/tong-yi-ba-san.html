      <p class="affiliation"><a href="../poems.html">&larr; 返回诗词目录</a></p>

    <section class="section">
      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">同一把伞与同一双眼</div>
        <div class="poem-verse">---看MTV kiss 有感</div>
        <div class="poem-verse">轻轻的雨天</div>
        <div class="poem-verse">守候着一把雨伞</div>
        <div class="poem-verse">任雨滴打湿美丽心愿</div>
        <div class="poem-verse">走过</div>
        <div class="poem-verse">两人世界的晴天</div>
        <div class="poem-verse">唤起心中</div>
        <div class="poem-verse">同一把雨伞的美丽期盼</div>
        <div class="poem-verse">没有承诺   没有波澜</div>
        <div class="poem-verse">而她却</div>
        <div class="poem-verse">在镜子中</div>
        <div class="poem-verse">看到了那双熟悉的眼</div>
        <div class="poem-verse">同一双眼   同一张照片</div>
        <div class="poem-verse">默默地诉说着</div>
        <div class="poem-verse">心中永远不变的爱恋</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2004年11月</div>
        </div>
      </div>
