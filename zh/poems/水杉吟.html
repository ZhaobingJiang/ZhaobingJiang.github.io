      <div class="poem">
        <pre class="poem-body">水杉吟

晨练畏炎蒸，熔金道欲平。
人踪随日绝，鸟语入云凝。
河静波如定，林深气自清。
千杉持戟立，列阵试新晴！

 ——江召兵 2025年7月7日于上秦淮湿地公园</pre>
