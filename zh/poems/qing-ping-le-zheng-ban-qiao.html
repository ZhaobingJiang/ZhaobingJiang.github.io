        <div class="poem-headline">清平乐 · 赏郑板桥《竹石兰花图轴》有感</div>
        <div class="poem-verse">竹影摇曳，石坚兰更幽。古来文人常郁郁，壮志凌云难展畴。</div>
        <div class="poem-para">欣逢盛世吾曹立，自由翱翔云汉游。激情岁月正当时，展翅高飞任我遒。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2025年1月2日于上海博物馆（东馆）书画展厅</div>
        </div>
