        <div class="poem-verse">山清水秀</div>
        <div class="poem-verse">太平指间流</div>
        <div class="poem-verse">快乐溢出九寨沟</div>
        <div class="poem-verse">留下此刻永久</div>
        <div class="poem-verse">天高云淡桥头</div>
        <div class="poem-verse">英姿飒爽逗留</div>
        <div class="poem-verse">凤求凰香巢构</div>
        <div class="poem-verse">何日携侣同游</div>
