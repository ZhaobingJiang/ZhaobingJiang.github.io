        <div class="poem-headline">七律 · 观东方明珠有感</div>
        <div class="poem-verse">美不胜收看不够，</div>
        <div class="poem-verse">犹望苍穹大银河。</div>
        <div class="poem-verse">何日飞天好摘星，</div>
        <div class="poem-verse">锻造明珠千万颗。</div>
