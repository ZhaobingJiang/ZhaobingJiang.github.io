      <p class="affiliation"><a href="../poems.html">&larr; 返回诗词目录</a></p>
    </div>

      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">生活思（二）</div>
        <div class="poem-verse">时间慢慢流逝</div>
        <div class="poem-verse">现实悄悄撩开朦胧薄纱</div>
        <div class="poem-verse">理想竟渐行渐远</div>
        <div class="poem-verse">生活啊</div>
        <div class="poem-verse">就这样在挣扎与彷徨间</div>
        <div class="poem-verse">浮现本来面孔</div>
        <div class="poem-verse">面对现实</div>
        <div class="poem-verse">是白天为名利忙碌</div>
        <div class="poem-verse">黑夜为人际烦忧</div>
        <div class="poem-verse">还是像树干上的蝉</div>
        <div class="poem-verse">夏季因炎热而聒噪</div>
        <div class="poem-verse">冬季因寒冷而长眠</div>
        <div class="poem-verse">儿时的梦想噢</div>
        <div class="poem-verse">竟如中弹的潜艇</div>
        <div class="poem-verse">慢慢在水面消失</div>
        <div class="poem-verse">只留下</div>
        <div class="poem-verse">扩散的圆圈</div>
        <div class="poem-verse">在辽阔的海天间</div>
        <div class="poem-verse">映着落日的余辉</div>
        <div class="poem-verse">渐渐衰减</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2007年10月15日</div>
        </div>
      </div>
