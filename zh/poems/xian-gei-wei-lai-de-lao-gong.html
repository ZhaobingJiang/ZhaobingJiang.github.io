      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">献给未来的老公</div>
        <div class="poem-verse">我希望我们</div>
        <div class="poem-verse">是相邻的两棵树</div>
        <div class="poem-verse">根须纠结，枝叶相触</div>
        <div class="poem-verse">分享每一次日出，星落</div>
        <div class="poem-verse">共享每一天雾霭，流云</div>
        <div class="poem-verse">相依而生，相偎而终</div>
        <div class="poem-verse">当我们一起枯萎</div>
        <div class="poem-verse">我们在深沉的泥土中</div>
        <div class="poem-verse">合为一体，不离不弃</div>
        <div class="poem-verse">我的幸福</div>
        <div class="poem-verse">只是有你一直在身边</div>
        <div class="poem-verse">请将我放在心上如印记</div>
        <div class="poem-verse">带在手上如戳记</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——束金琳，2006年12月24日（圣诞平安夜）</div>
        </div>
      </div>
