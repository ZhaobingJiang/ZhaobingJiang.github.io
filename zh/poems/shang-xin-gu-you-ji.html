        <div class="poem-headline">赏心谷游记</div>
        <div class="poem-verse">赏心悦目赏心谷，</div>
        <div class="poem-verse">流连忘返流连处。</div>
        <div class="poem-verse">几声鸳鸣踏香径，</div>
        <div class="poem-verse">数点星辰话清语。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2022年3月11日于江宁赏心谷</div>
