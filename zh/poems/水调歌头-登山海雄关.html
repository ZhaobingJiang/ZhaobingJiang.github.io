      <div class="poem">
        <pre class="poem-body">水调歌头 · 登山海雄关

地脉贯燕幽，潮信接沧溟。
雄关横锁辽蓟，风雪镇龙庭。
鞭扫峰峦如脊，首探洪波似戟，鳞甲曜寒晶。
良将铸筋骨，士气腾鲲鹏。

家国事，兴亡局，总萦情。
当年锁裂，安在砖石固坚城？
但使心垣如铁，更聚苍生为岳，浩宇共潮平。
极目登临处，朝日破云生。

 ——江召兵 2025年12月25日于山海关</pre>
