        <div class="poem-body">
        <div class="poem-headline">临江仙 · 蓬莱阁同窗偕游</div>
        <div class="poem-verse">姜袖分云登蜃阙，才风漫卷潮书。</div>
        <div class="poem-verse">丹崖万古峙蓬壶。</div>
        <div class="poem-verse">八仙踪未渺，鸥鹭引青裾。</div>
        <div class="poem-blank"></div>
        <div class="poem-verse">忽指坡公诗壁在，沧波犹诵当初。</div>
        <div class="poem-verse">故人笑指海天舒：</div>
        <div class="poem-verse">“烟霞非幻境，情在即瀛洲！”</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2025年8月17日于蓬莱阁</div>
        </div>
      </div>
