      <p class="affiliation"><a href="../poems.html">&larr; 返回诗词目录</a></p>
    </div>
    <section class="section">
      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">悬崖</div>
        <div class="poem-verse">想象中的悬崖</div>
        <div class="poem-verse">越过去便是</div>
        <div class="poem-verse">心目中的乐土</div>
        <div class="poem-verse">趴在万丈悬崖的边沿</div>
        <div class="poem-verse">就这样小心翼翼  如履薄冰地</div>
        <div class="poem-verse">一个身长一个身长的往上爬</div>
        <div class="poem-verse">唯恐</div>
        <div class="poem-verse">掉进那深不见地的悬崖</div>
        <div class="poem-verse">也许</div>
        <div class="poem-verse">悬崖上并不是天堂</div>
        <div class="poem-verse">也许</div>
        <div class="poem-verse">脚下悬挂的深渊</div>
        <div class="poem-verse">并非豺狼横行  荆棘遍地</div>
        <div class="poem-verse">生命的意义</div>
        <div class="poem-verse">多一个未知数便多一份激情</div>
        <div class="poem-verse">但什么都未知</div>
        <div class="poem-verse">生活就充满了迷茫</div>
        </div>
      </div>
      <p class="poem-pager"><a class="pub-dl" href="./shen-yu-xin.html">&larr; 身与心</a>&nbsp;&nbsp;|&nbsp;&nbsp;<a class="pub-dl" href="./xian-gei-wei-lai-de-lao-gong.html">献给未来的老公 &rarr;</a></p>
