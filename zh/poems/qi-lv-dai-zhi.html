      <div class="poem">
        <div class="poem-body">
        <div class="poem-headline">七律 · 代职</div>
        <div class="poem-verse">两岸恩怨总难堪，</div>
        <div class="poem-verse">经纶学成下闽南。</div>
        <div class="poem-verse">喜闻咱家添犬子，</div>
        <div class="poem-verse">急欲返宁归似箭。</div>
        <div class="poem-verse">初为人父洋洋意，</div>
        <div class="poem-verse">过隙白驹恨太短。</div>
        <div class="poem-verse">但愿青春卫家园，</div>
        <div class="poem-verse">杨柳未折赴前线。</div>
        <div class="poem-blank"></div>
        <div class="poem-note">背景：2008年6月博士毕业后，于9月5日来福建代职。2009年1月15日返宁，2月5日北辰宝宝出生，3月1日在宝宝未满月之际即要归闽，心中很不是滋味。</div>
        <div class="poem-blank"></div>
        <div class="poem-sign">——江召兵2009年3月10日</div>
        </div>
      </div>
