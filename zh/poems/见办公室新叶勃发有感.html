      <div class="poem">
        <pre class="poem-body">见办公室新叶勃发有感

喜闻铁树又开花，
乐见旧木发新芽。
四方辐辏逢雨露，
上秦淮畔衔新家。

 ——江召兵2020年8月28日于千人大厦</pre>
