<script>
(function(){
"use strict";
const D = window.YL_DATA;
const $ = (s, r) => (r||document).querySelector(s);
const $$ = (s, r) => Array.from((r||document).querySelectorAll(s));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('ylz.'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem('ylz.'+k, JSON.stringify(v)); }catch(e){} }
};
const CHAPTERS = D.chapters;
const state = {
  ci: 0,
  simp: LS.get('simp', true),
  trans: LS.get('trans', true),
  notes: LS.get('notes', false),
  py: LS.get('py', true),
  fs: LS.get('fs', 19),
  theme: LS.get('theme', 'paper')
};

/* ---------- 工具 ---------- */
function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function richBody(s){
  return esc(s).replace(/【([^】]{1,8})】/g, '<span class="lab">【$1】</span>').replace(/\n/g,'<br>');
}
function pyChar(ch){
  const p = D.pinyin && D.pinyin[ch];
  if(!p) return esc(ch);
  return '<ruby>'+esc(ch)+'<rt>'+esc(p)+'</rt></ruby>';
}
function hasPy(ch){ return !!(D.pinyin && D.pinyin[ch]); }

/* 段落渲染：词注下划线 + 生僻字注音 */
function paraHtml(p){
  const simp = state.simp;
  const text = simp ? (p.text_simp || p.text) : p.text;
  const words = p.notes.filter(n => n.word && (n.word.length>0));
  // 生成匹配表（按目标字形，长词优先，允许重叠时取最长）
  const chars = Array.from(text);
  const posMap = new Array(chars.length).fill(null);
  const anchors = words.map(n => ({t: Array.from(simp ? (n.word_simp || n.word) : (n.word || n.word_simp)), ids:[n.id]}))
                       .filter(a => a.t.length>0);
  anchors.sort((a,b)=>b.t.length-a.t.length);
  for(const a of anchors){
    const n = a.t.length;
    for(let i=0;i<=chars.length-n;i++){
      let ok = true;
      for(let j=0;j<n;j++){ if(chars[i+j]!==a.t[j]){ ok=false; break; } }
      if(ok && posMap[i]===null){ posMap[i] = {len:n, ids:a.ids}; }
    }
  }
  let html = '';
  for(let i=0;i<chars.length;i++){
    const m = posMap[i];
    if(m){
      let inner = '';
      for(let j=0;j<m.len;j++) inner += pyChar(chars[i+j]);
      html += '<span class="w" data-nids="'+esc(m.ids.join(','))+'">'+inner+'</span>';
      i += m.len-1;
    }else{
      html += pyChar(chars[i]);
    }
  }
  return html;
}

function tagOf(n){
  if(n.level === 'word') return ['词','word'];
  if(n.level === 'sentence') return ['句','sentence'];
  if(n.level === 'chapter') return ['篇','chapter'];
  if(n.level === 'paragraph') return [n.type||'段',''];
  return [n.type||'注',''];
}
function noteHtml(n){
  const [lab, cls] = tagOf(n);
  let q = '';
  if(n.quote) q = '<span class="quote">「'+esc(n.quote)+'」</span> ';
  else if(n.word) q = '<span class="quote">「'+esc(state.simp ? (n.word_simp||n.word) : n.word)+'」</span> ';
  const refs = (n.refs && n.refs.length) ? '<span class="refs">参考：'+esc(n.refs.join('、'))+'</span>' : '';
  return '<li id="note-'+esc(n.id)+'"><span class="tag '+cls+'">'+lab+'</span>'+q+richBody(n.body)+refs+'</li>';
}

function chapterHtml(ch, idx){
  const simp = state.simp;
  const title = simp ? ch.title : (ch.title_trad || ch.title);
  const volLine = ch.volume + '　' + (ch.volume_source||'');
  const alt = simp ? (ch.title_trad && ch.title_trad !== title ? ch.title_trad : '') : (ch.title && ch.title !== title ? ch.title : '');
  let h = '<div class="bookhead"><div class="vol">'+esc(volLine)+'</div>'+
          '<h1>'+esc(title)+'</h1>'+
          (alt ? '<div class="alt">'+esc(alt)+'</div>' : '')+
          '<div class="sub">第 '+(idx+1)+' 篇　共 '+CHAPTERS.length+' 篇　·　'+D.meta.subtitle+'</div></div>';
  (ch.secs||[]).forEach((sec, si)=>{
    const st = simp ? sec.title : (sec.title_trad || sec.title);
    const only = si === 0 && (sec.title === ch.title || sec.title === ch.title_trad || st === title);
    h += '<section class="sec">'+(only ? '' : '<h3><span class="sn">'+String(sec.num? (sec.num<10?'0'+sec.num:sec.num):'')+'</span>'+esc(st)+'</h3>');
    (sec.paras||[]).forEach(p=>{
      const ns = p.notes||[];
      h += '<div class="para" id="'+esc(p.id)+'">';
      h += '<p class="orig">'+paraHtml(p)+'</p>';
      if(p.trans) h += '<div class="trans">'+esc(p.trans)+'</div>';
      if(ns.length){
        h += '<div class="pnotes"><button class="nchip" data-open="'+esc(p.id)+'">注疏 <b>'+ns.length+'</b> 条</button>';
        h += '<ul class="nlist">'; ns.forEach(n=>{ h += noteHtml(n); }); h += '</ul></div>';
      }
      h += '</div>';
    });
    h += '</section>';
  });
  if((ch.chapNotes||[]).length){
    h += '<div class="chapnotes"><h4>本篇通论</h4><ul class="nlist">';
    ch.chapNotes.forEach(n=>{ h += noteHtml(n); });
    h += '</ul></div>';
  }
  const prev = idx>0 ? CHAPTERS[idx-1] : null;
  const next = idx<CHAPTERS.length-1 ? CHAPTERS[idx+1] : null;
  h += '<nav class="chnav">'+(prev?'<a href="#'+prev.id+'" data-ch="'+(idx-1)+'">← 第'+(idx)+'篇　'+esc(simp?prev.title:prev.title_trad)+'</a>':'<span>卷首</span>')+
       (next?'<a href="#'+next.id+'" data-ch="'+(idx+1)+'">第'+(idx+2)+'篇　'+esc(simp?next.title:next.title_trad)+'　→</a>':'<span>全书终</span>')+'</nav>';
  h += '<div class="foot">原著 明·刘基　|　注疏 江召兵　|　底本 四部丛刊初编影明隆庆六年何镗编本<br>'+
       '全 '+D.meta.counts.paras+' 段译文 · '+D.meta.counts.notes+' 条注疏 · 免费在线阅读<br>'+
       '© 南京欧帕提亚信息科技有限公司 · 开发者 江召兵 博士</div>';
  return h;
}

/* ---------- 渲染与导航 ---------- */
function buildToc(){
  let h = '';
  (D.volumes||[]).forEach(v=>{
    h += '<div class="toc-vol">'+esc(v.label)+(v.source?'<span>'+esc(v.source)+'</span>':'')+'</div>';
    v.chapters.forEach(cid=>{
      const i = CHAPTERS.findIndex(c=>c.id===cid);
      if(i<0) return;
      const c = CHAPTERS[i];
      h += '<a class="toc-a" href="#'+c.id+'" data-ch="'+i+'"><i>'+String(i+1).padStart(2,'0')+'</i>'+esc(c.title)+'</a>';
    });
  });
  $('#tocBody').innerHTML = h;
}
function markToc(){
  $$('#tocBody .toc-a').forEach(a=>a.classList.toggle('on', Number(a.dataset.ch)===state.ci));
}
function render(idx, opts){
  opts = opts || {};
  const keep = opts.keep === true;
  const y = keep ? window.scrollY : 0;
  state.ci = Math.max(0, Math.min(CHAPTERS.length-1, idx||0));
  const ch = CHAPTERS[state.ci];
  $('#content').innerHTML = chapterHtml(ch, state.ci);
  document.title = ch.title + ' · 郁离子 注疏';
  markToc();
  LS.set('ci', state.ci);
  if(keep){ window.scrollTo(0, y); }
  else {
    window.scrollTo(0, 0);
    if(opts.restore) restorePos();
  }
  $('#pbar').style.width = ((state.ci+1)/CHAPTERS.length*100).toFixed(2)+'%';
}
function openChapter(idx, opts){
  render(idx, opts);
  history.replaceState(null,'','#'+CHAPTERS[state.ci].id);
}

/* 滚动位置记忆 */
let stTimer = null;
function savePos(){
  if(!$('#reader').classList.contains('on')) return;
  clearTimeout(stTimer);
  stTimer = setTimeout(()=>{ LS.set('pos.'+CHAPTERS[state.ci].id, Math.round(window.scrollY)); }, 260);
}
function restorePos(){
  const y = LS.get('pos.'+CHAPTERS[state.ci].id, 0);
  if(y>200) setTimeout(()=>window.scrollTo(0,y), 30);
}

/* ---------- 界面状态 ---------- */
function applyState(){
  document.body.dataset.theme = state.theme;
  document.body.classList.toggle('hide-trans', !state.trans);
  document.body.classList.toggle('notes-on', state.notes);
  document.body.classList.toggle('no-py', !state.py);
  document.documentElement.style.setProperty('--fs', state.fs+'px');
  $$('[data-mode]').forEach(b=>b.classList.toggle('on', (b.dataset.mode==='simp')===state.simp));
  $('#btnTrans').classList.toggle('on', state.trans);
  $('#btnNotes').classList.toggle('on', state.notes);
  $('#btnPy').classList.toggle('on', state.py);
  $('#btnTheme').textContent = state.theme==='paper'?'纸色':(state.theme==='warm'?'暖黄':'夜间');
}
function bind(){
  $('#landing').addEventListener('click', ()=>{
    $('#landing').style.display='none';
    $('#reader').classList.add('on');
    const saved = LS.get('ci', 0);
    const hash = location.hash.replace('#','');
    const idx = D.chapters.findIndex(c=>c.id===hash);
    openChapter(idx>=0?idx:saved, {restore:true});
    applyState();
  });
  $('#landing').addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); $('#landing').click(); } });
  $('#tocBtn').addEventListener('click', ()=>{ $('#toc').classList.add('on'); $('#mask').classList.add('on'); });
  const closeToc = ()=>{ $('#toc').classList.remove('on'); $('#mask').classList.remove('on'); };
  $('#tocClose').addEventListener('click', closeToc);
  $('#mask').addEventListener('click', closeToc);
  $('#tocBody').addEventListener('click', e=>{
    const a = e.target.closest('a[data-ch]'); if(!a) return;
    e.preventDefault(); closeToc(); openChapter(Number(a.dataset.ch));
  });
  $$('[data-mode]').forEach(b=>b.addEventListener('click', ()=>{
    state.simp = b.dataset.mode==='simp'; LS.set('simp', state.simp); applyState(); render(state.ci, {keep:true});
  }));
  $('#btnTrans').addEventListener('click', ()=>{ state.trans=!state.trans; LS.set('trans',state.trans); applyState(); });
  $('#btnNotes').addEventListener('click', ()=>{ state.notes=!state.notes; LS.set('notes',state.notes); applyState(); });
  $('#btnPy').addEventListener('click', ()=>{ state.py=!state.py; LS.set('py',state.py); applyState(); });
  $('#btnFsDown').addEventListener('click', ()=>{ state.fs=Math.max(16,state.fs-1); LS.set('fs',state.fs); applyState(); });
  $('#btnFsUp').addEventListener('click', ()=>{ state.fs=Math.min(23,state.fs+1); LS.set('fs',state.fs); applyState(); });
  $('#btnTheme').addEventListener('click', ()=>{
    state.theme = state.theme==='paper'?'warm':(state.theme==='warm'?'night':'paper');
    LS.set('theme',state.theme); applyState();
  });
  $('#btnCover').addEventListener('click', ()=>{
    $('#reader').classList.remove('on');
    $('#landing').style.display='flex';
    history.replaceState(null,'',location.pathname);
  });
  // 底部/篇间跳转
  $('#content').addEventListener('click', e=>{
    const a = e.target.closest('a[data-ch]');
    if(a){ e.preventDefault(); openChapter(Number(a.dataset.ch)); return; }
    const chip = e.target.closest('.nchip');
    if(chip){ $('#'+CSS.escape(chip.dataset.open)).classList.toggle('open'); return; }
    const w = e.target.closest('.w');
    if(w){
      const ids = (w.dataset.nids||'').split(',').filter(Boolean);
      if(!ids.length) return;
      const para = w.closest('.para'); if(para) para.classList.add('open');
      const card = document.getElementById('note-'+ids[0]);
      if(card){ card.scrollIntoView({block:'center', behavior:'smooth'}); card.classList.add('flash'); setTimeout(()=>card.classList.remove('flash'), 1600); }
    }
  });
  window.addEventListener('scroll', ()=>{ savePos(); }, {passive:true});
  window.addEventListener('keydown', e=>{
    if(e.key==='Escape'){ $('#toc').classList.remove('on'); $('#mask').classList.remove('on'); }
    if(!$('#reader').classList.contains('on')) return;
    const t = e.target; if(t && /INPUT|TEXTAREA|SELECT/.test(t.tagName)) return;
    if(e.key==='ArrowRight' && state.ci<CHAPTERS.length-1){ openChapter(state.ci+1); }
    if(e.key==='ArrowLeft' && state.ci>0){ openChapter(state.ci-1); }
    if(e.key==='t'||e.key==='T'){ $('#tocBtn').click(); }
  });
  window.addEventListener('hashchange', ()=>{
    const hash = location.hash.replace('#','');
    const idx = D.chapters.findIndex(c=>c.id===hash);
    if(idx>=0 && $('#reader').classList.contains('on') && idx!==state.ci) openChapter(idx);
  });
}

/* ---------- 启动 ---------- */
function boot(){
  if(D && D.meta){
    $('#lm-counts').textContent = '十八篇 · '+D.meta.counts.paras+' 段 · '+D.meta.counts.notes+' 条注疏';
  }
  buildToc();
  bind();
  applyState();
  // 直接带章节 hash 进入时跳过封面
  const hash = location.hash.replace('#','');
  const idx = D.chapters.findIndex(c=>c.id===hash);
  if(idx>=0){
    $('#landing').style.display='none';
    $('#reader').classList.add('on');
    render(idx, {restore:true});
  }
}
boot();
})();
</script>
</body>
</html>
